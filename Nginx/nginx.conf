user  nginx;                 # 실행 사용자
worker_processes auto;       # 워커 프로세스 수 (CPU 코어에 맞게 자동)

events {
    worker_connections 1024; # 워커 프로세스당 최대 연결 수
}

http {
    include       mime.types;       # MIME 타입 정의
    default_type  application/octet-stream;

    sendfile        on;             # 파일 전송 최적화
    keepalive_timeout  65;          # 연결 유지 시간

    server {
        listen 80;                  # HTTP 포트
        server_name example.com;    # 도메인 이름

        location / {
            root   /usr/share/nginx/html;   # 정적 파일 경로
            index  index.html index.htm;
        }

        # location /api/ {
        #     proxy_pass http://backend:5000; # 백엔드 서버로 프록시
        # }
    }
}