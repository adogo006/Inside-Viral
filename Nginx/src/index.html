<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsideViral</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="page-indicator">
        <a href="#chart-section" class="indicator">그래프</a>
        <a href="#logs-section" class="indicator">로그</a>
    </div>

    <section id="chart-section" class="page-section">
        <div class="section-header">
            <div class="section-title">감성지수 그래프</div>
            <div class="section-subtitle">커뮤니티의 분위기를 나타냅니다.</div>
        </div>
        <div class="header">
            <span id="topic-select">
                미국주식 갤러리
                <div class="dropdown-menu">
                    <div class="dropdown-item" onclick="changeTopic('한국주식 갤러리', 'ko-stocks')">한국주식</div>
                    <div class="dropdown-item" onclick="changeTopic('미국주식 갤러리', 'stockus')">미국주식</div>
                    <div class="dropdown-item" onclick="changeTopic('비트코인 갤러리', 'crypto')">비트코인</div>
                    <div class="dropdown-item" onclick="changeTopic('종합', 'ent')">종합</div>
                </div>
            </span>

            <div class="timeframe-select">
                <button class="tf-btn active" data-tf="1D">1D</button>
                <button class="tf-btn" data-tf="7D">7D</button>
                <button class="tf-btn" data-tf="1M">1M</button>
                <button class="tf-btn" data-tf="1Y">1Y</button>
            </div>
        </div>

        <div class="chart-wrapper" style="position: relative;">
            <div id="chart-container"></div>
            
            <div id="chart-error" style="display: none; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 16px; position: absolute; top: 0; left: 0; width: 100%; background: #ffffff; z-index: 10;">
                데이터를 불러올 수 없습니다
            </div>
            
            <img id="emotionGif" class="emotion-gif" style="display: none;">
        </div>
    </section>

    <section id="logs-section" class="page-section">
        <div class="section-header">
            <div class="section-title">실행 로그</div>
            <div class="section-subtitle">프로그램 실행 중 생성되는 로그를 이곳에서 확인하세요.</div>
        </div>

        <div class="logs-wrapper">
            <div id="log-panel" class="log-panel" aria-label="실행 로그"></div>
        </div>
    </section>

    <script src="./scripts/script.js"></script>
</body>
</html>
